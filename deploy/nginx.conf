server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_certificate /etc/nginx/ssl/aurora.crt;
    ssl_certificate_key /etc/nginx/ssl/aurora.key;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Microservicio Catalog
    location /api/catalog {
        proxy_pass http://127.0.0.1:30001/api/catalog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Microservicio Customers
    location /api/customers {
        proxy_pass http://127.0.0.1:30002/api/customers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Microservicio Orders
    location /api/orders {
        proxy_pass http://127.0.0.1:30003/api/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Modulo Legado Apache
    location /legacy/inventory {
        proxy_pass http://127.0.0.1:8080/inventory.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
